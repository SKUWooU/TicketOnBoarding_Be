# This profile is local measurement plumbing and must never be enabled in production.
server.address=127.0.0.1
management.server.address=127.0.0.1
management.server.port=${MANAGEMENT_SERVER_PORT:18081}
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=onticket-loadtest

# Keep the measurement process deterministic and avoid development-only restart/logging noise.
debug=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN

onticket.loadtest.fixture.rows=${ONTICKET_LOADTEST_ROWS:50}
onticket.loadtest.fixture.seats-per-row=${ONTICKET_LOADTEST_SEATS_PER_ROW:40}
onticket.ticket.checkout-payment-verification-grace-duration=PT30S

spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
