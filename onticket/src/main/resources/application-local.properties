server.port=${SERVER_PORT:18080}

spring.datasource.url=jdbc:mariadb://${ONTICKET_DB_HOST:localhost}:${ONTICKET_DB_PORT:3307}/${ONTICKET_DB_NAME:onticket_local}
spring.datasource.username=${ONTICKET_DB_USERNAME:onticket}
spring.datasource.password=${ONTICKET_DB_PASSWORD:onticket}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# Default is the repeated local matrix winner. Matrix runs can still override this local environment variable.
spring.datasource.hikari.maximum-pool-size=${ONTICKET_HIKARI_MAXIMUM_POOL_SIZE:24}

# Flyway owns the local schema. Baseline is opt-in only after V1-equivalence is checked.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${ONTICKET_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
onticket.ticket.virtual-seat-unit-price=30000
onticket.ticket.checkout-payment-verification-grace-duration=PT30S
spring.batch.job.enabled=false

jwt.issuer=${JWT_ISSUER:onticket-local}
jwt.secret=${JWT_SECRET}
spring.kopis.url=${KOPIS_API_URL:https://example.invalid}
spring.kopis.apiKey=${KOPIS_API_KEY:local-placeholder}
spring.coolsms.apiKey=${COOLSMS_API_KEY:local-placeholder}
spring.coolsms.apiSecret=${COOLSMS_API_SECRET:local-placeholder}
naver.client.id=${NAVER_CLIENT_ID:local-placeholder}
naver.client.secret=${NAVER_CLIENT_SECRET:local-placeholder}
