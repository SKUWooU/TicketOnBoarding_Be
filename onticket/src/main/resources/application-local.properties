server.port=${SERVER_PORT:18080}

spring.datasource.url=jdbc:mariadb://${ONTICKET_DB_HOST:localhost}:${ONTICKET_DB_PORT:3307}/${ONTICKET_DB_NAME:onticket_local}
spring.datasource.username=${ONTICKET_DB_USERNAME:onticket}
spring.datasource.password=${ONTICKET_DB_PASSWORD:onticket}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Local runtime uses a disposable Hibernate schema until the Flyway baseline is established.
spring.jpa.hibernate.ddl-auto=create
spring.batch.job.enabled=false

jwt.issuer=${JWT_ISSUER:onticket-local}
spring.kopis.url=${KOPIS_API_URL:https://example.invalid}
spring.kopis.apiKey=${KOPIS_API_KEY:local-placeholder}
spring.coolsms.apiKey=${COOLSMS_API_KEY:local-placeholder}
spring.coolsms.apiSecret=${COOLSMS_API_SECRET:local-placeholder}
naver.client.id=${NAVER_CLIENT_ID:local-placeholder}
naver.client.secret=${NAVER_CLIENT_SECRET:local-placeholder}
