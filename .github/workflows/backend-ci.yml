name: Backend CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: onticket

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: onticket/**/*.gradle*

      - name: Validate contention metrics collector
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          ./load-test/scripts/Test-ContentionMetrics.ps1
          ./load-test/scripts/Test-ContentionBaseline.ps1
          ./load-test/scripts/Test-StatementDigestDiagnostics.ps1
          ./load-test/scripts/Test-ContentionBottleneckDiagnosis.ps1

      - name: Run Backend tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-${{ github.event.pull_request.number }}
          path: |
            onticket/build/reports/tests/test
            onticket/build/test-results/test
          retention-days: 7

